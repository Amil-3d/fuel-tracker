name: Explore VT
on:
  push:
    branches: [explore-vt]
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fetch_menus_vt.py
      - run: python -c "import json;d=json.load(open('data/menu-vt.json'));print(d['courts'],d['dates']);c=d['courts'][0];print(json.dumps(d['menus'][c],indent=1)[:1500]);import itertools;print(json.dumps(dict(itertools.islice(d['items'].items(),6)),indent=1));print('nokcal',[v['name'] for v in d['items'].values() if v.get('kcal') is None][:30])"
