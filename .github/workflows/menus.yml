name: Update dining menus
on:
  schedule:
    # 10:00 UTC = 6:00 AM EDT (5:00 AM EST in winter)
    - cron: "0 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: menus
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      # Each school runs on its own, so one site being down doesn't block the other.
      - name: Purdue
        run: python scripts/fetch_menus.py
        continue-on-error: true
      - name: Virginia Tech
        run: python scripts/fetch_menus_vt.py
        continue-on-error: true
      - name: Commit menus if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No menu changes."
          else
            git commit -m "Update dining menus for $(TZ=America/New_York date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
