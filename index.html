<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fuel</title>
  <meta name="description" content="Personal nutrition and fitness tracker">
  <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fuel">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('fuel-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar"><h1 id="page-title">Fuel</h1><div id="topbar-action"></div></header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" hidden>
  <div class="pill">
    <a href="#/today" data-tab="today">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Today</span></a>
    <a href="#/food" data-tab="food">
      <svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg><span>Food</span></a>
    <a href="#/progress" data-tab="progress">
      <svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg><span>Progress</span></a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></a>
  </div>
  <a class="fab" href="#/food/add" aria-label="Log food"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></a>
  </nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="crash" hidden></div>
  <script>
    // If something breaks, show what happened on screen (instead of a blank page) with a way out.
    (function () {
      function show(msg) {
        var el = document.getElementById('crash');
        if (!el || !el.hidden) return;
        el.hidden = false;
        el.innerHTML = '<b>Something went wrong.</b><pre></pre>' +
          '<button type="button" data-r>Reload</button> <button type="button" data-x>Reset app files</button>' +
          '<small>Reset keeps your logged food and weights.</small>';
        el.querySelector('pre').textContent = msg;
        el.querySelector('[data-r]').onclick = function () { location.reload(); };
        el.querySelector('[data-x]').onclick = function () {
          var jobs = [];
          if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }));
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
          Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
        };
      }
      window.addEventListener('error', function (e) {
        var where = e.filename ? ' (' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno + ')' : '';
        show((e.message || 'Error') + where);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show((r && (r.stack || r.message)) || String(r));
      });
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
